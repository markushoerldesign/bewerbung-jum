/* ============================================================
   JUM — EIN BLICK INS ÜBERMORGEN
   Alle Inhalte liegen zentral in CONTENT / PROFILE (siehe <script>)
   ============================================================ */
:root{
  --bg:#F2F0E9;
  --ink:#111111;
  --grey:#6F6E68;
  --acc:#C7FF3D;
  --acc-soft:#E7FFAD;
  --line:#D5D2C9;
  --dark:#26251F;
  --on-dark:#F2F0E9;
  --font-display:'Instrument Serif','Times New Roman',Georgia,serif;
  --font-body:'Inter',system-ui,-apple-system,sans-serif;
  --font-mono:'IBM Plex Mono','SFMono-Regular',Menlo,monospace;
  --pad:5.5vw;
  --gap-txt:clamp(9px,1.5vh,20px);
  --markus-scale:1.62;
  --markus-shift:clamp(64px,10.5vw,185px);
  --tight:-.02em;        /* Überlappung der Blöcke */
  --tight-word:-.09em;   /* Unterlängenraum unter dem Wort */
  --e:cubic-bezier(.22,.61,.36,1);
  --eio:cubic-bezier(.65,.05,.2,1);
}
body.dark{--bg:#26251F;--ink:#F2F0E9;--grey:#A5A39B;--line:#403E37}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-weight:400;
  font-size:clamp(1.05rem,1.3vw,1.25rem);line-height:1.55;letter-spacing:-.01em;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background-color 1.4s var(--e),color 1.4s var(--e);
}
#nav,.chip,.unode .lbl,#ucore .bg,.media{transition:background-color 1.4s var(--e),color 1.4s var(--e),border-color 1.4s var(--e)}
body.dark .media{background:rgba(242,240,233,.06)}
body.dark .ph::after{background:repeating-linear-gradient(135deg,rgba(242,240,233,.06) 0 1px,transparent 1px 11px)}
h1,h2,h3,.display{font-family:var(--font-display);font-weight:400;letter-spacing:-.01em;line-height:.94}
.mono{font-family:var(--font-mono);font-weight:500;font-size:clamp(11px,.85vw,13px);letter-spacing:.06em;text-transform:uppercase;color:var(--grey)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--acc);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- reveal-basis ---------- */
.rv{opacity:0;transform:translateY(22px);transition:opacity .9s var(--e),transform .9s var(--e)}
.rv.in{opacity:1;transform:none}
.rv.d1{transition-delay:.12s}.rv.d2{transition-delay:.24s}.rv.d3{transition-delay:.36s}.rv.d4{transition-delay:.5s}

/* ---------- INTRO ---------- */
#intro{position:relative}
.hero{min-height:100svh;padding:var(--pad);display:flex;flex-direction:column;justify-content:center;position:relative}
.hero .kicker{font-family:var(--font-display);font-weight:400;font-size:clamp(1.3rem,2.4vw,2.2rem);letter-spacing:-.01em;color:var(--grey)}
.hero .lead{font-family:var(--font-display);font-weight:400;font-size:clamp(1.8rem,4.2vw,4rem);letter-spacing:-.01em;line-height:1}
.hero .huge{font-family:var(--font-display);font-weight:400;font-size:clamp(3.6rem,9vw,9.5rem);letter-spacing:-.012em;line-height:.9;margin-top:.02em}
.hero .hq{font-family:var(--font-display);font-weight:400;font-size:clamp(1.5rem,2.6vw,2.5rem);line-height:1.15;letter-spacing:-.008em;color:var(--grey);max-width:20ch;margin-top:clamp(38px,8vh,96px)}
.scrollcue{position:absolute;left:var(--pad);bottom:calc(var(--pad) - 1vw);display:flex;align-items:center;gap:10px}
.scrollcue .arw{display:inline-block;animation:bob 2.6s var(--eio) infinite}
@keyframes bob{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(5px);opacity:1}}

/* ---------- STORY-STAPEL + MARKUS-REVEAL ---------- */
#reveal{height:440vh;position:relative}
#revealStage{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;justify-content:center;padding:0 var(--pad);overflow:hidden}
#words{position:relative;z-index:2;width:100%;padding-left:0;transition:padding-left 1.3s var(--e),transform 1.3s var(--e);transform-origin:left center}
#words.big{transform:scale(var(--markus-scale))}
#words.shift{padding-left:var(--markus-shift)}
#msr{position:absolute;visibility:hidden;width:0;height:0;padding-left:var(--markus-shift);pointer-events:none}
.blk{display:grid;grid-template-rows:0fr;opacity:0;font-size:clamp(1.4rem,5.6vw,5.2rem);transition:grid-template-rows 1.1s var(--e),opacity .9s var(--e)}
.blk.on{grid-template-rows:1fr;opacity:1}
.blk + .blk{margin-top:var(--tight)}
.blkin{overflow:hidden;min-height:0}
.saywrap{display:grid;grid-template-rows:1fr;opacity:1;filter:blur(0);transition:grid-template-rows 1s var(--e),opacity .8s var(--e),filter .8s var(--e),transform .9s var(--e);transform:translateY(0)}
.saywrap>div{overflow:hidden;min-height:0}
.blk.done .saywrap{grid-template-rows:0fr;opacity:0;filter:blur(5px);transform:translateY(-14px)}
.say{font-family:var(--font-display);font-weight:400;font-size:clamp(1.35rem,2.4vw,2.3rem);line-height:1.15;letter-spacing:-.008em;color:var(--grey);max-width:26ch;padding-bottom:var(--gap-txt)}
.blk:not(:first-child) .say{padding-top:calc(var(--gap-txt) * 5)}
.say span{display:block}
.word{font-family:var(--font-display);font-weight:400;font-size:1em;line-height:1.0;letter-spacing:-.012em;white-space:nowrap;display:block;padding-bottom:0;margin-bottom:var(--tight-word)}
.ltr{display:inline-block;transition:opacity 1.1s var(--e),transform 1.2s var(--e),filter 1.1s var(--e)}
#words.dis .ltr:not(.head){opacity:0;filter:blur(6px)}
#portrait{position:absolute;z-index:3;left:0;bottom:0;height:min(88svh,792px);opacity:0;transition:opacity 1.1s var(--e);pointer-events:none}
#portrait.on{opacity:1}
#portrait .media{height:100%;width:auto;background:none;overflow:visible}
#portrait .media img{height:100%;width:auto;object-fit:contain}
#revealNote{position:absolute;right:var(--pad);bottom:var(--pad);max-width:22ch;text-align:right;opacity:0;transition:opacity 1.2s var(--e)}
#revealNote.on{opacity:1}

/* ---------- APP: Navigation + Bühne ---------- */
#app{display:none;position:relative}
#app.on{display:block}
.layout{display:grid;grid-template-columns:minmax(280px,32%) 1fr;align-items:start}
#nav{position:sticky;top:0;height:100svh;padding:var(--pad);display:flex;flex-direction:column;justify-content:center;gap:6px;border-right:1px solid var(--line);background:var(--bg);z-index:40}
.navlist{display:flex;flex-direction:column;gap:clamp(2px,.5vh,7px)}
.navitem{position:relative;text-align:left;font-family:var(--font-display);font-weight:400;font-size:clamp(16px,2vw,30px);letter-spacing:-.01em;line-height:1.1;color:var(--grey);transition:transform .45s var(--e),color .35s var(--e);padding:1px 0}
.navitem:hover{color:var(--ink)}
.navitem[aria-current="true"]{transform:translateX(10px);color:var(--ink)}
.navitem[aria-current="true"]::before{content:"→";position:absolute;left:-1.05em;font-family:var(--font-mono);font-weight:500;font-size:.5em;top:.42em;color:var(--acc)}
#nav .cvlink{margin-top:clamp(32px,5vh,52px);align-self:flex-start;border-bottom:1px solid var(--line);padding-bottom:3px;transition:border-color .3s,color .3s}
#nav .cvlink:hover,#nav .cvlink[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
#nav .sig{margin-top:auto;position:absolute;bottom:var(--pad);left:var(--pad);right:var(--pad)}

#stage{min-height:100svh;padding:var(--pad)}
.panel{display:none}
.panel.on{display:block}
.mstage,.astage,.ustage,.sstage,.kstage{overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin}
.panelhead{padding:clamp(40px,12vh,120px) 0 clamp(28px,6vh,60px);max-width:24ch}
.panelhead h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.5rem,min(3.4vw,4.6vh),3.2rem);line-height:1;letter-spacing:-.01em}

.mutetxt{color:var(--grey);max-width:56ch}

/* ---------- Bild / Platzhalter ---------- */
.media{position:relative;width:100%;aspect-ratio:var(--ar,4/3);background:rgba(17,17,17,.035);overflow:hidden}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .8s var(--e)}
.media.ok img{opacity:1}
.media.ok .ph{display:none}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:4px;padding:14px;border:1px solid var(--line)}
.ph b{font-family:'IBM Plex Mono';font-size:10px;font-weight:500;letter-spacing:.1em;color:var(--ink);word-break:break-all}
.ph i{font-family:'IBM Plex Mono';font-style:normal;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)}
.ph::after{content:"";position:absolute;inset:0;background:
  repeating-linear-gradient(135deg,rgba(17,17,17,.045) 0 1px,transparent 1px 11px);pointer-events:none}

/* ---------- M: Situationen ---------- */
#p-menschenkenntnis{margin:calc(var(--pad) * -1);padding:0 var(--pad)}
.mstage{position:sticky;top:0;height:100svh;padding:clamp(14px,2.5vh,34px) 0;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2.6vh,32px)}
.mstage .panelhead{padding:0}
.mlist{border-top:1px solid var(--line);max-width:860px}
.mrow{border-bottom:1px solid var(--line);padding:clamp(20px,3.6vh,36px) 0;display:flex;gap:clamp(16px,3vw,44px);align-items:baseline}
.mrow .num{flex:none;padding-top:4px}
.mrow h3{font-family:var(--font-display);font-weight:400;font-size:clamp(1rem,min(2vw,2.9vh),1.9rem);letter-spacing:-.01em;line-height:1.1}
.mrow .meta{margin-top:10px}
.mrow .mdesc{margin-top:clamp(10px,1.6vh,18px);color:var(--grey);max-width:56ch;font-size:clamp(.88rem,min(1.15vw,1.8vh),1.1rem)}

/* ---------- A: Perspektiven ---------- */
#p-allroundtalent{margin:calc(var(--pad) * -1);padding:0 var(--pad)}
.astage{position:sticky;top:0;height:100svh;padding:clamp(16px,3vh,40px) 0;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,38px)}
.ahead h2{font-family:var(--font-display);font-weight:400;font-size:clamp(1.5rem,min(3.4vw,4.6vh),3.2rem);line-height:1;letter-spacing:-.01em}
.ahead .mono{margin-top:14px}
.abody{position:relative;flex:0 1 auto;display:grid;grid-template-columns:minmax(170px,32%) 1fr;gap:clamp(20px,4vw,64px);align-items:center}
.alist{display:flex;flex-direction:column;align-items:flex-start;gap:clamp(3px,.8vh,9px);position:relative;z-index:2}
.aterm{font-family:var(--font-mono);font-weight:500;font-size:clamp(10px,.92vw,13px);letter-spacing:.06em;padding:7px 13px;border:1px solid var(--line);border-radius:999px;color:var(--grey);white-space:nowrap;transition:color .3s,border-color .3s,background .4s var(--e),opacity .4s}
.aterm:hover{color:var(--ink);border-color:var(--ink)}
.aterm.sel{background:rgba(17,17,17,.09);border-color:var(--ink);color:var(--ink)}
.alist.locked .aterm:not(.sel){opacity:.3;pointer-events:none}
#alines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
#alines line{stroke:var(--ink);stroke-width:1;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);transition:stroke-dashoffset .9s var(--e)}
#alines.draw line{stroke-dashoffset:0}
#aout{position:relative;z-index:2;min-height:clamp(150px,26vh,240px);display:flex;flex-direction:column;justify-content:center;max-width:34ch}
#aout .pre{opacity:.85}
#aout .res{font-family:var(--font-display);font-weight:400;font-size:clamp(1rem,min(2.2vw,3.2vh),2.1rem);line-height:1.22;letter-spacing:-.008em;margin-top:14px;opacity:0;transition:opacity .8s var(--e)}
#aout .res.on{opacity:1}
.reset{margin-top:20px;border-bottom:1px solid var(--line);padding-bottom:2px}
.reset:hover{border-color:var(--ink)}
.thinking::after{content:"";display:inline-block;width:7px;height:7px;background:var(--acc);border:1px solid var(--ink);margin-left:6px;animation:pulse 1s infinite steps(2)}
@keyframes pulse{50%{opacity:.15}}

/* ---------- R: Prozess ---------- */
#p-realisierungskraft{margin:calc(var(--pad) * -1);padding:0 var(--pad)}
.rstage{position:sticky;top:0;height:100svh;padding:clamp(14px,2.5vh,34px) 0;display:flex;flex-direction:column;justify-content:center;gap:clamp(10px,1.8vh,22px)}
.rword{font-family:var(--font-display);font-weight:400;font-size:clamp(2.4rem,min(7.5vw,11vh),7rem);letter-spacing:-.012em;line-height:1;transition:opacity .5s var(--e),filter .5s var(--e)}
.rword.out{opacity:0;filter:blur(6px)}
.rtextwrap{min-height:clamp(110px,18vh,170px);max-width:58ch}
.rtextwrap p{color:var(--grey);font-size:clamp(.9rem,min(1.25vw,2vh),1.15rem);line-height:1.5;transition:opacity .5s var(--e)}
.rtextwrap p + p{margin-top:.8em}
.rtextwrap.out{opacity:0}
.rmarks{display:flex;align-items:center;gap:clamp(8px,1.2vw,16px);flex-wrap:wrap;margin-top:clamp(4px,1vh,14px)}
.rmark{width:clamp(38px,5.5vw,72px);height:3px;background:var(--line);transition:background .35s,height .35s var(--e)}
.rmark:hover{background:var(--ink)}
.rmark[aria-current="true"]{height:7px;background:var(--grey)}
.rnext{margin-left:clamp(10px,1.6vw,24px);border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .3s,border-color .3s}
.rnext:hover{color:var(--ink);border-color:var(--ink)}

/* ---------- K: Projekte ---------- */
#p-kreativitaet{margin:calc(var(--pad) * -1);padding:0 var(--pad)}
.kstage{position:sticky;top:0;height:100svh;padding:clamp(14px,2.5vh,34px) 0;display:flex;flex-direction:column;justify-content:center;gap:clamp(14px,2.6vh,32px)}
.kstage .panelhead{padding:0}
#p-kreativitaet.open .kstage{position:static;height:auto;display:block;padding:clamp(24px,6vh,70px) 0 clamp(40px,9vh,110px)}
.klist{border-top:1px solid var(--line);max-width:900px}
.krow{width:100%;text-align:left;border-bottom:1px solid var(--line);padding:clamp(20px,4vh,36px) 0;display:flex;justify-content:space-between;align-items:baseline;gap:20px;transition:padding-left .5s var(--e)}
.krow:hover{padding-left:14px}
.krow h3{font-family:var(--font-display);font-weight:400;font-size:clamp(19px,min(3vw,4.4vh),44px);letter-spacing:-.01em}
.krow .hint{opacity:0;transition:opacity .4s}
.krow:hover .hint{opacity:1}
#kproject{display:none;padding-top:clamp(24px,5vh,50px)}
#kproject.on{display:block}
.lupe{position:relative;width:100%;max-width:840px;aspect-ratio:var(--heroAr,16/9);overflow:hidden;cursor:none;background:rgba(17,17,17,.04)}
.lupe .layer{position:absolute;inset:0}
.lupe .full{-webkit-mask-image:radial-gradient(circle 150px at var(--mx,50%) var(--my,50%),#000 0 55%,rgba(0,0,0,.25) 72%,transparent 82%);mask-image:radial-gradient(circle 150px at var(--mx,50%) var(--my,50%),#000 0 55%,rgba(0,0,0,.25) 72%,transparent 82%);transition:opacity .6s}
.lupe.open .full{-webkit-mask-image:none;mask-image:none}
.lupe .veil{background:var(--bg);opacity:.93;pointer-events:none;transition:opacity .9s var(--e)}
.lupe.open .veil{opacity:0}
.lupe .hintline{position:absolute;left:16px;bottom:14px;z-index:3;transition:opacity .5s}
.lupe.open .hintline{opacity:0}
.khero{max-width:840px}
.kvideo{background:rgba(17,17,17,.04)}
.kvideo video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#000}
.kgrid{display:grid;gap:clamp(14px,2vw,26px);grid-template-columns:1fr;margin-top:clamp(20px,4vh,40px);max-width:840px}
@media(min-width:720px){.kgrid{grid-template-columns:1fr 1fr}}
.ksteps{display:grid;gap:clamp(20px,4vh,38px);margin-top:clamp(26px,5vh,52px);max-width:760px}
@media(min-width:800px){.ksteps{grid-template-columns:repeat(3,1fr)}}
.kstep .lab{margin-bottom:8px}
.kstep p{font-size:15px;line-height:1.5;color:var(--ink)}
.back{margin-top:clamp(26px,5vh,50px);border-bottom:1px solid var(--line);padding-bottom:2px}
.back:hover{border-color:var(--ink)}

/* ---------- U: Netzwerk ---------- */
#p-unternehmergeist{margin:calc(var(--pad) * -1);padding:0 var(--pad)}
.ustage{position:sticky;top:0;height:100svh;padding:clamp(14px,2.5vh,34px) 0;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,38px)}
.ubody{position:relative;display:grid;grid-template-columns:1fr minmax(240px,34%);gap:clamp(20px,3.5vw,52px);align-items:center}
.ugraph{position:relative;width:min(46svh,420px);height:min(46svh,420px);margin:0 auto;
  transform:rotate(var(--rot,0deg));transition:transform 1.1s var(--e)}
.unode .lbl{transform:rotate(calc(var(--rot,0deg) * -1));transition:transform 1.1s var(--e),color .3s,opacity .5s}
#uedges{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#uedges line{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
#ulink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;overflow:visible}
#ulink line{stroke:var(--ink);stroke-width:1;stroke-dasharray:var(--l);stroke-dashoffset:var(--l);transition:stroke-dashoffset .8s var(--e)}
#ulink.draw line{stroke-dashoffset:0}
.unode[aria-current="true"] .lbl{opacity:0}
.unode{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2}
.unode .dot{position:relative;z-index:3;width:9px;height:9px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 5px var(--bg);transition:background .3s,transform .4s var(--e),box-shadow .3s}
.unode .lbl{font-family:var(--font-mono);font-weight:500;font-size:clamp(9px,.8vw,12px);letter-spacing:.06em;color:var(--grey);white-space:nowrap;padding:0;pointer-events:none;
  text-shadow:0 0 5px var(--bg),0 0 5px var(--bg),0 0 5px var(--bg);transition:color .3s}
.unode:hover .lbl{color:var(--ink)}
.unode:hover .dot{transform:scale(1.3)}
.unode[aria-current="true"] .dot{background:var(--ink);transform:scale(1.55)}
.unode[aria-current="true"] .lbl{color:var(--ink)}
.udetail{min-height:clamp(180px,32vh,300px);display:flex;flex-direction:column;justify-content:center;gap:16px}
.udetail .media{background:rgba(17,17,17,.04)}
.udetail .utext{font-family:var(--font-display);font-weight:400;font-size:clamp(.9rem,min(1.4vw,2.2vh),1.35rem);line-height:1.3;letter-spacing:-.006em;max-width:34ch}
.udetail .ulab{margin-bottom:2px}

/* ---------- S: Storytelling ---------- */
#p-storytelling{margin:calc(var(--pad) * -1);padding:0 var(--pad)}
.swrap{position:relative}
.sstage{position:sticky;top:0;height:100svh;padding:clamp(16px,3vh,40px) 0;display:flex;flex-direction:column;justify-content:center;gap:clamp(16px,3vh,34px)}
.sframe{position:relative;height:min(54svh,500px);width:100%}
.sitem{position:absolute;left:0;bottom:0;height:100%;opacity:0;transform-origin:left bottom;transform:scale(1.02);filter:blur(0);transition:opacity 1.1s var(--e),transform 1.3s var(--e),filter 1.1s var(--e);will-change:transform,opacity;z-index:1}
.sitem .media{height:100%;width:auto;background:none;overflow:visible}
.sitem .media img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.sitem.cur{opacity:1;transform:none;z-index:3}
.sitem.gone{opacity:0;transform:scale(.97);filter:blur(4px);z-index:1}
.scaps{position:relative;min-height:clamp(150px,24vh,230px)}
.scapwrap{position:absolute;left:0;top:0;width:100%;opacity:0;filter:blur(7px);transform:translateY(10px);transition:opacity .9s var(--e),filter .9s var(--e),transform .9s var(--e);pointer-events:none}
.scapwrap.cur{opacity:1;filter:none;transform:none;pointer-events:auto}
.scap{font-family:var(--font-display);font-weight:400;font-size:clamp(18px,min(3.1vw,4.6vh),46px);letter-spacing:-.01em;line-height:1.08;max-width:20ch}
.snav{display:flex;align-items:center;gap:clamp(14px,2vw,28px);margin-top:2px}
.snav button{border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .3s,border-color .3s}
.snav button:hover{color:var(--ink);border-color:var(--ink)}
.sbook{margin-top:6px}
.sbook .t{font-family:var(--font-display);font-weight:400;font-size:clamp(16px,min(2.2vw,3.2vh),32px);letter-spacing:-.006em;display:inline-block;text-decoration:none}
.booklink{display:block;text-decoration:none;transition:opacity .4s var(--e)}
.booklink:hover{opacity:.82}
.sbook .t:hover .mono{color:var(--acc)}

/* ---------- CV / AI ---------- */
.cvchoice{display:grid;gap:clamp(14px,2vw,22px);max-width:680px;grid-template-columns:1fr}
@media(min-width:700px){.cvchoice{grid-template-columns:1fr 1fr}}
.cvopt{text-align:left;border:1px solid var(--line);padding:clamp(20px,3vw,32px);min-height:clamp(120px,18vh,180px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;transition:border-color .4s,transform .5s var(--e),background .4s}
.cvopt:hover{border-color:var(--ink);transform:translateY(-3px)}
.cvopt strong{font-family:var(--font-display);font-weight:400;font-size:clamp(17px,1.9vw,26px);letter-spacing:-.006em}
#ask{display:none;padding-top:clamp(20px,4vh,40px);max-width:760px}
#ask.on{display:block}
#ask h3{font-size:clamp(26px,4vw,58px);letter-spacing:-.035em;max-width:14ch}
.askfield{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--ink);margin-top:clamp(26px,5vh,48px);padding-bottom:12px}
.askfield input{flex:1;border:0;background:none;font-family:var(--font-display);font-weight:400;font-size:clamp(18px,2.4vw,32px);letter-spacing:-.006em;color:var(--ink)}
.askfield input::placeholder{color:var(--grey);opacity:.7}
.askfield input:focus{outline:none}
.askfield button{font-family:'IBM Plex Mono';font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--grey);transition:color .3s}
.askfield button:hover{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
.qchip{font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.08em;padding:7px 12px;border:1px solid var(--line);border-radius:999px;color:var(--grey);transition:.3s}

/* ---------- Cursor ---------- */
#cur{position:fixed;top:0;left:0;width:9px;height:9px;border-radius:50%;background:var(--ink);pointer-events:none;z-index:200;transform:translate(-50%,-50%);transition:width .3s var(--e),height .3s var(--e),background .3s;mix-blend-mode:normal;display:none}
#cur.big{width:66px;height:66px;background:var(--acc);border:1px solid var(--ink)}
#cur span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .25s}
#cur.big span{opacity:1}
@media(hover:hover) and (pointer:fine){#cur{display:block}}

/* ---------- Mobile ---------- */

/* Bild mit hochwertigem Platzhalter im echten Seitenverhältnis */
function media(file, ar='4/3', alt='', cls='', embedKey=''){
  const fb = embedKey && EMBED[embedKey] ? `this.onerror=null;this.src=EMBED['${embedKey}']` : `this.remove()`;
  return `<figure class="media ${cls}" style="--ar:${ar}">
    <img src="${ASSET_BASE}${file}" alt="${esc(alt)}" loading="lazy" decoding="async"
      onload="this.parentNode.classList.add('ok')" onerror="${fb}">
    <span class="ph"><i>Bild fehlt — bitte ersetzen</i><b>${file}</b></span></figure>`;
}
function io(el, cb, opts){
  const o=new IntersectionObserver(es=>es.forEach(e=>cb(e)), Object.assign({threshold:.3},opts||{}));
  o.observe(el); return o;
}
function revealAll(root=document){
  $$('.rv',root).forEach(el=>io(el,e=>{ if(e.isIntersecting) el.classList.add('in'); },{threshold:.2}));
}

const OVERLAP = 0.35;   // wie weit das Bild in die Buchstabenspalte reicht
function placePortrait(){
  const po=$('#portrait'), head=$('#words .ltr.head'), msr=$('#msr');
  if(!po||!head||!msr) return;
  // Endwerte, keine laufenden Übergänge: offsetWidth/offsetLeft ignorieren transform
  const S = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--markus-scale')) || 1;
  const P = parseFloat(getComputedStyle(msr).paddingLeft) || 0;
  const W0 = wordsEl.offsetLeft;                 // linke Kante der Wortspalte in der Bühne

}

/* ------------------------------------------------------------------
   OFFEN — VOR DEM LIVEGANG BEARBEITEN
   Bereich A (Allroundtalent), Ergebnistexte der Begriffspaare:
   1. Prompt in combine() unten fixieren — Ton, Länge, Haltung.
   2. Die 10–15 wichtigsten Paare hier in PAIRS fest hinterlegen,
      damit genau die gewünschten Sätze erscheinen.
   3. FRAMES sind die Rückfallmuster für alle übrigen Kombinationen.
   9 Begriffe = 36 mögliche Paare.
   ------------------------------------------------------------------ */
const PAIRS={
  'ETHIK|KI':'Wie nutzen wir KI für bessere Ideen, ohne Verantwortung an sie abzugeben?',
  'DESIGN|GESUNDHEIT':'Wie kann Gestaltung Verhalten verändern, ohne Menschen zu belehren?',
  'PROJEKTMANAGEMENT|STORYTELLING':'Was passiert, wenn komplexe Systeme plötzlich eine Geschichte bekommen?',
  'GESUNDHEIT|VERTRIEB':'Beides scheitert am selben Punkt: wenn man Menschen etwas verkauft, statt sie zu verstehen.',
  'DESIGN|ETHIK':'Jede Gestaltung trifft eine Entscheidung für jemanden — die Frage ist nur, ob bewusst.',
  'SPORTWISSENSCHAFT|VERTRIEB':'Beides lebt von Wiederholung: Die Frage ist nur, wer die Pausen plant.',
  'KI|UNTERNEHMERTUM':'Wenn Entscheidungen billiger werden, wird Urteilsvermögen zum eigentlichen Kapital.',
  'PROJEKTMANAGEMENT|KREATIVITÄT':'Struktur ist kein Gegner der Idee, sondern der Grund, warum sie jemand zu sehen bekommt.'
};
const FRAMES=[
  (a,b)=>`Was passiert, wenn ${a} nicht Thema, sondern Methode für ${b} wird?`,
  (a,b)=>`${a} kennt die Regeln, ${b} kennt die Menschen — interessant wird es dort, wo beides dieselbe Entscheidung trifft.`,
  (a,b)=>`Wie viel von ${a} steckt eigentlich schon in ${b}, ohne dass es jemand so nennt?`,
  (a,b)=>`Wenn ${b} das Ziel ist, wäre ${a} vielleicht der ehrlichere Weg dorthin.`,
  (a,b)=>`Was müsste ${a} aufgeben, damit ${b} funktioniert — und wäre das ein Verlust?`
];
async function combine(a,b){
  const key=[a,b].sort().join('|');
  const sys=`Du formulierst eine einzige, sehr kurze gedankliche Verbindung zwischen zwei Wissensfeldern. Regeln: Deutsch. Maximal 1–2 Sätze. Klug, überraschend, prägnant. Keine AI-Buzzwords, keine Floskeln, kein Marketing. Erfinde niemals Erfahrungen, Projekte oder Leistungen einer Person. Nur der Gedanke selbst, gern als Frage. Antworte ausschließlich mit dem Satz.`;
  const txt=await ai(sys, `${a} + ${b}`, 150);
  if(txt) return txt.trim();
  if(PAIRS[key]) return PAIRS[key];
  const h=[...key].reduce((s,c)=>s+c.charCodeAt(0),0);
  return FRAMES[h%FRAMES.length](a,b);
}

let uRot=0, uLineTimer=0;
function rotateTo(node){
  const g=$('#ugraph'), lab=$('#udetail .ulab'); if(!g||!lab) return;
  const gr=g.getBoundingClientRect(), lr=lab.getBoundingClientRect();
  const cx=gr.left+gr.width/2, cy=gr.top+gr.height/2;
  // Zielrichtung: vom Mittelpunkt zur Bildüberschrift
  const target=Math.atan2((lr.top+lr.height/2)-cy, (lr.left-14)-cx)*180/Math.PI;
  // Ausgangswinkel des Knotens im ungedrehten Layout
  const base=Math.atan2(node.offsetTop-g.clientHeight/2, node.offsetLeft-g.clientWidth/2)*180/Math.PI;
  let delta=target-base-uRot;
  delta=((delta+180)%360+360)%360-180;   // kürzesten Weg nehmen
  uRot+=delta;
  g.style.setProperty('--rot', uRot.toFixed(2)+'deg');
}
function drawULink(node){
  const body=$('.ubody'), lab=$('#udetail .ulab'), svg=$('#ulink'), ln=svg&&svg.querySelector('line');
  if(!body||!lab||!ln) return;
  const br=body.getBoundingClientRect(), dr=node.querySelector('.dot').getBoundingClientRect(), lr=lab.getBoundingClientRect();
  svg.setAttribute('viewBox',`0 0 ${br.width} ${br.height}`);
  const x1=dr.left-br.left+dr.width/2, y1=dr.top-br.top+dr.height/2;
  const x2=lr.left-br.left-12, y2=lr.top-br.top+lr.height/2;
  ln.setAttribute('x1',x1); ln.setAttribute('y1',y1); ln.setAttribute('x2',x2); ln.setAttribute('y2',y2);
  ln.style.setProperty('--l', Math.hypot(x2-x1,y2-y1));
  requestAnimationFrame(()=>svg.classList.add('draw'));
}
addEventListener('resize',()=>{ const cur=$('.unode[aria-current="true"]'); if(cur) drawULink(cur); });

const AI_ENDPOINT='https://api.anthropic.com/v1/messages';
async function ai(system,user,max=400){
  try{
    const r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:max,system,messages:[{role:'user',content:user}]})});
    if(!r.ok) return null;
    const d=await r.json();
    const t=(d.content||[]).map(c=>c.type==='text'?c.text:'').join('').trim();
    return t||null;
  }catch(e){ return null; }
}

async function submitQ(q){
  q=(q||'').trim(); if(!q) return;
  $('#askInput').value='';
  const el=document.createElement('div'); el.className='qa';
  el.innerHTML=`<div class="q">${esc(q)}</div><div class="a thinking" style="color:var(--grey)">denkt nach</div>`;
  $('#thread').prepend(el);
  const sys=`Du beantwortest Fragen über Markus Hörl in seinem Namen ("ich"), im Rahmen seiner Bewerbung als Geschäftsführer Kreation bei josefundmaria communications.
STRENGE REGELN:
- Nutze ausschließlich die folgende Wissensbasis. Erfinde niemals Fakten, Zahlen, Zeiträume, Kunden oder Erfolge.
- Fehlt eine Information, antworte genau: "Dazu habe ich in Markus' Unterlagen keine verlässliche Information." und nenne kurz, was stattdessen belegt ist.
- Maximal 120 Wörter. Kurz, persönlich, konkret. Keine Bewerbungssprache, keine Übertreibungen, keine Aufzählungszeichen.
- Wenn die Antwort zu einem Bereich passt, hänge als allerletzte Zeile an: LINK: <id> mit id aus menschenkenntnis|allroundtalent|realisierungskraft|kreativitaet|unternehmergeist|storytelling. Sonst keine Linkzeile.
WISSENSBASIS (JSON):
${JSON.stringify(PROFILE)}`;
  let txt=await ai(sys,q,500);
  if(!txt) txt=mockAnswer(q);
  let link=null;
  txt=txt.replace(/LINK:\s*([a-zä]+)\s*$/i,(m,id)=>{ link=id.toLowerCase(); return ''; }).trim();
  el.innerHTML=`<div class="q">${esc(q)}</div><div class="a">${esc(txt).replace(/\n/g,'<br>')}</div>`+
    (link&&LABELS[link]?`<button class="jump" data-goto="${link}">→ ${LABELS[link]} ansehen</button>`:'');
  const j=el.querySelector('.jump'); if(j) j.addEventListener('click',()=>setPanel(link));
}
function mockAnswer(q){
  const s=q.toLowerCase();
  if(s.includes('jum')||s.includes('warum'))
    return 'Dazu habe ich in Markus\u2019 Unterlagen keinen ausformulierten Motivationstext \u2014 der Platzhalter dafür ist im Profil markiert. Belegt ist: Er hat Produkte entwickelt, produziert und verkauft, Projekte in einem Umfeld von bis zu 10.000 Mitarbeitenden umgesetzt, CNC-gefertigte Trophäen für den Meydan Dubai World Cup 2015 gestaltet und zwei Bücher geschrieben. Idee, Umsetzung und Verantwortung liegen bei ihm also nah beieinander.\nLINK: unternehmergeist';
  if(s.includes('führ')||s.includes('team'))
    return 'Führungserfahrung ist belegt bei Merkur Lifestyle (Teamleitung, Kinder- und Jugendevents) und als Geschäftsführer von Mind Entry® zwischen 2019 und 2022. Teamgrößen und genaue Zeiträume liegen mir in den Unterlagen nicht verlässlich vor \u2014 sie sind als Platzhalter markiert.\nLINK: menschenkenntnis';

    return 'Konkret umgesetzt: Gesundheits- und Sicherheitsprojekte bei Magna Steyr für ein Umfeld von bis zu 10.000 Mitarbeitenden, Kinder- und Jugendevents bei Merkur Lifestyle, der Aufbau von Mind Entry® von Entwicklung über Produktion bis Vertrieb sowie CNC-gefertigte High-End-Trophäen für den Meydan Dubai World Cup 2015.\nLINK: realisierungskraft';
  if(s.includes('ki')||s.includes('ai'))
    return 'Belegt ist ein Masterstudium Angewandte Ethik mit einer Masterarbeit zu Automated Machine Learning in KMU und den ethischen Anforderungen an Transparenz von KI. KI ist für ihn also weniger Werkzeugfrage als Verantwortungsfrage. Weitere Details dazu liegen mir in den Unterlagen nicht vor.\nLINK: allroundtalent';
  if(s.includes('lebenslauf')||s.includes('ungewöhnlich'))
    return 'Der Weg führt über Tiefbau, Sportwissenschaft, Vertriebsmanagement, Gesundheits- und Projektmanagement, eigenes Unternehmertum, angewandte Ethik und Fertigung mit CNC, 3D-Druck und Laser. Das ist kein gerader Lebenslauf, aber einer, in dem Idee, Technik, Mensch und Geschäft dieselbe Person betreffen.\nLINK: allroundtalent';
  return 'Dazu habe ich in Markus\u2019 Unterlagen keine verlässliche Information. Belegt sind seine Stationen bei Magna Steyr, Merkur Lifestyle, Fast Motion und Mind Entry®, die Trophäen für den Meydan Dubai World Cup 2015 sowie die Bücher „Mit Stress hoch hinaus!“ und „Die Glücklichmacherin“.';
}
